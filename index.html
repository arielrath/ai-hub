
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171044">
  <title>AI HUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>AI HUB</h1>
    <p>המרכז האישי שלך לבינה מלאכותית</p>
  </header>

  <main>
    <h2>ברוכים הבאים ל-AI HUB</h2>
    <p>כל הכלים החכמים במקום אחד.</p>

    <section class="tools">
      <button onclick="showMessage('מחולל תמונות')">יצירת תמונות</button>
      <button onclick="document.getElementById('ai-chat').scrollIntoView({behavior:'smooth'})">עוזר AI</button>
      <button onclick="showMessage('משחקים')">משחקים</button>
      <button onclick="showMessage('כלים חכמים')">כלים חכמים</button>
    </section>

<section id="ai-chat">
  <h2>AI HUB Assistant</h2>
  <div id="chat-box">
    <p>שלום! אני העוזר של AI HUB. במה אפשר לעזור?</p>
  </div>
  <input id="user-input" type="text" placeholder="כתוב הודעה..." />
  <button onclick="sendMessage()">שלח</button>
</section>
    
    <p id="message"></p>
  </main>

  <script src="script.js"></script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
                                                                  </script>
</body>
  </html>
